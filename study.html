<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 閱讀教材與選擇題</title><link rel="stylesheet" href="route.css"><style>.quiz label{display:block;padding:12px;background:#f3f6f8;margin:8px 0;cursor:pointer}.quiz fieldset{border:1px solid #ccd4da;border-radius:8px;margin:20px 0;padding:16px}.quiz legend{font-weight:700}.feedback{padding:14px;border-left:4px solid #185c91}.wrong{border-color:#b44d22}#lesson p{white-space:pre-line}#lesson{background:white;padding:28px;border-radius:12px;min-width:0}.lesson-section{margin-bottom:28px}#lesson code{font-size:15px}.question-status{font-weight:700}</style><script defer src="study-data.js"></script><script defer src="study.js"></script></head><body><header><a href="study.html">AI 閱讀教材</a></header><main><p class="eyebrow">閱讀 · 看懂範例 · 選擇題驗收</p><h1>在這裡讀懂，<br>在這裡檢查理解。</h1><p class="lead">不用另找影片、不用交申論。每課提供解說、案例與立即判分的選擇題。</p><section class="intro"><p>每次預留約 30 分鐘：閱讀 15 分、範例理解 10 分、答題與解析 5 分。依內容和熟悉程度調整，不必為了計時而停留。這是概念理解課程；選擇題通過不代表已具備獨立開發能力。</p><p>原本的 588 項活動已合併為 <strong>76 個主題、155 題選擇題</strong>。不再用活動數推算總學時；舊筆記仍留在原瀏覽器儲存空間，新版只記錄選項與驗收結果。</p></section><section class="dashboard"><div><b id="count"></b><progress id="progress" max="76" value="0"></progress></div><button id="resume">繼續學習</button><button id="export">匯出進度</button><label class="upload">匯入進度<input id="import" type="file" accept="application/json,.json"></label><p id="status" role="status"></p></section><div class="workspace"><aside><label for="stage">階段</label><select id="stage"><option value="">全部階段</option></select><label for="search">搜尋主題</label><input id="search" type="search" placeholder="例如：Python、RAG、梯度"><label><input type="checkbox" id="todo">只看尚未通過</label><p id="matches"></p><nav id="units" aria-label="課程列表"></nav></aside><article id="lesson" tabindex="-1"></article></div><p class="muted">答案與進度只存此瀏覽器，不會上傳或交給 AI 批改。答案解析由教材預先編寫；外部來源僅供查證，完成本頁不需開啟。</p></main></body></html>
